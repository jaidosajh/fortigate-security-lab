# Clean root-VDOM lab only; confirm interface mappings first.
config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set ip 192.0.2.10 255.255.255.0
        unset allowaccess
    next
    edit "port2"
        set vdom "root"
        unset allowaccess
    next
    edit "port3"
        set vdom "root"
        set mode static
        set ip 10.255.0.1 255.255.255.0
        set allowaccess ping https ssh
    next
    edit "users"
        set vdom "root"
        set interface "port2"
        set vlanid 10
        set ip 10.10.10.1 255.255.255.0
    next
    edit "servers"
        set vdom "root"
        set interface "port2"
        set vlanid 20
        set ip 10.10.20.1 255.255.255.0
    next
    edit "guest"
        set vdom "root"
        set interface "port2"
        set vlanid 30
        set ip 10.10.30.1 255.255.255.0
    next
    edit "management"
        set vdom "root"
        set interface "port2"
        set vlanid 99
        set ip 10.10.99.1 255.255.255.0
    next
end
config router static
    edit 1
        set gateway 192.0.2.1
        set device "port1"
    next
end
