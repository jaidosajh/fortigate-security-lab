config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set ip 192.0.2.20 255.255.255.0
        unset allowaccess
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 10.20.10.1 255.255.255.0
        unset allowaccess
    next
    edit "port3"
        set vdom "root"
        set mode static
        set ip 10.255.1.1 255.255.255.0
        set allowaccess ping https ssh
    next
end
config router static
    edit 1
        set gateway 192.0.2.1
        set device "port1"
    next
end
