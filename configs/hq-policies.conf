config firewall address
    edit "USERS_NET"
        set subnet 10.10.10.0 255.255.255.0
    next
    edit "GUEST_NET"
        set subnet 10.10.30.0 255.255.255.0
    next
    edit "SERVERS_NET"
        set subnet 10.10.20.0 255.255.255.0
    next
    edit "MGMT_NET"
        set subnet 10.10.99.0 255.255.255.0
    next
    edit "LAB_WEB"
        set subnet 10.10.20.10 255.255.255.255
    next
    edit "RFC1918_10"
        set subnet 10.0.0.0 255.0.0.0
    next
    edit "RFC1918_172"
        set subnet 172.16.0.0 255.240.0.0
    next
    edit "RFC1918_192"
        set subnet 192.168.0.0 255.255.0.0
    next
end
config firewall addrgrp
    edit "INTERNAL_NETS"
        set member "RFC1918_10" "RFC1918_172" "RFC1918_192"
    next
end
config firewall service custom
    edit "LAB_HTTPS"
        set tcp-portrange 443
    next
    edit "LAB_DNS"
        set tcp-portrange 53
        set udp-portrange 53
    next
end
config firewall policy
    edit 10
        set name "guest-block-internal"
        set srcintf "guest"
        set dstintf "any"
        set srcaddr "GUEST_NET"
        set dstaddr "INTERNAL_NETS"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat disable
    next
    edit 20
        set name "users-web-server"
        set srcintf "users"
        set dstintf "servers"
        set srcaddr "USERS_NET"
        set dstaddr "LAB_WEB"
        set action accept
        set schedule "always"
        set service "LAB_HTTPS"
        set logtraffic all
        set nat disable
    next
    edit 30
        set name "guest-egress"
        set srcintf "guest"
        set dstintf "port1"
        set srcaddr "GUEST_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "LAB_DNS" "LAB_HTTPS"
        set logtraffic all
        set nat enable
    next
    edit 40
        set name "users-egress"
        set srcintf "users"
        set dstintf "port1"
        set srcaddr "USERS_NET"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "LAB_DNS" "LAB_HTTPS"
        set logtraffic all
        set nat enable
    next
    edit 90
        set name "log-default-deny"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set nat disable
    next
end
