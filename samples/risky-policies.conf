# Intentionally insecure synthetic policy for testing the auditor.
config firewall policy
    edit 1
        set name "overly-broad-lab-rule"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
    next
end
